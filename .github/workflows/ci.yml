name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la corrida anterior de la misma rama: no tiene sentido
# esperar el resultado de un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # WeasyPrint arma los PDF (tickets y comprobantes) apoyándose en estas
      # bibliotecas del sistema. Sin ellas, el import falla en tiempo de
      # ejecución y no al instalar, así que el error aparecería recién en un
      # test de PDF.
      - name: Bibliotecas de sistema para WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ruff lintea y black formatea. Nunca `ruff format`: dos formateadores
      # con criterios distintos sobre los mismos archivos se pisan en cada
      # commit. La versión de black está clavada en pyproject.toml y tiene que
      # coincidir con el rev del hook de pre-commit.
      - name: Lint (ruff)
        run: ruff check app tests alembic

      - name: Formato (black)
        run: black --check app tests alembic

      - name: Tipos (mypy)
        run: mypy app

      # Corren sobre SQLite en memoria: sin base de datos de servicio, sin
      # .env y sin red.
      - name: Tests
        run: pytest

      # La base y los modelos tienen que estar al día entre sí: si alguien
      # cambió un modelo sin generar la migración, esto lo encuentra ahora y
      # no en el despliegue.
      - name: Migraciones al día
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tipos (tsc)
        run: pnpm exec tsc -b

      - name: Lint (eslint)
        run: pnpm exec eslint .

      - name: Formato (prettier)
        run: pnpm exec prettier --check "src/**/*.{ts,tsx,css}" "e2e/**/*.ts"

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Navegadores de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests de punta a punta
        run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
