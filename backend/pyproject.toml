[project]
name = "anorak-backend"
version = "0.1.0"
description = "Backend del sistema de gestion para local de ropa"
requires-python = ">=3.12"
# Esta lista tiene que coincidir con requirements.txt (lo que usa Railway para
# el deploy). El CI instala con `pip install -e ".[dev]"`, que solo lee de aca:
# un paquete que falte en esta lista rompe el import de app.main en CI aunque
# ande en Railway y en la maquina local.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    "pillow>=10.0.0",
    "qrcode>=7.4.0",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    # Clavada, no ">=": el formateador decide byte a byte como queda el codigo,
    # asi que una version distinta en CI que en la maquina hace fallar
    # `black --check` sin que nadie haya tocado nada. Tiene que coincidir con el
    # rev del hook en .pre-commit-config.yaml, y se suben las dos juntas.
    "black==26.5.1",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# `alembic` es un paquete instalado, pero como el proyecto tiene una carpeta
# con ese nombre, ruff lo toma por codigo propio y reordena los imports de
# cada migracion generada.
known-third-party = ["alembic"]

# ruff es el linter y nada mas. El formateador es black y solo black:
# `ruff format` no se usa en este proyecto.

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Explicito para no depender del default: si cambia entre versiones, la
# suite empieza a fallar sin que nadie haya tocado un test.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=0"

[tool.coverage.run]
omit = ["tests/*", "alembic/*"]
